context:
  version: "5.10.0"

package:
  name: certbot-dns-sakuracloud
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/certbot-dns-sakuracloud/certbot_dns_sakuracloud-${{ version }}.tar.gz
  sha256: 2059c883b302979c3817c7b1408d101489c27e2521b7fef3211f78c40d1f59fc

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - acme >=${{ version }}
    - certbot >=${{ version }}
    - dns-lexicon >=3.14.1

tests:
  - python:
      imports:
        - certbot_dns_sakuracloud
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://certbot.eff.org
  summary: Sakura Cloud DNS Authenticator plugin for Certbot
  license: Apache-2.0
  license_file: LICENSE.txt
  documentation: https://certbot.eff.org
  repository: https://github.com/certbot/certbot

extra:
  recipe-maintainers:
    - pavelzw
